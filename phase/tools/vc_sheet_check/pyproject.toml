[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-sheet-check"
version = "1.0.0"
description = "Layer-jump checks for Volume Cartographer meshes, writing integration contract v1 outputs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-image>=0.22", "scikit-learn>=1.3", "zarr>=2.16",
                "numcodecs", "tifffile", "joblib", "ortools==9.15.6755"]

[project.scripts]
vc-sheet-check = "vc_sheet_check.cli:main"
vc_sheet_check = "vc_sheet_check.cli:main_a42"

[tool.setuptools]
packages = ["vc_sheet_check", "vc_sheet_check._vendor", "vc_sheet_check._vendor.core"]

[tool.setuptools.package-data]
"vc_sheet_check._vendor" = ["PROVENANCE.json"]
"vc_sheet_check" = ["power_calibration.json"]
